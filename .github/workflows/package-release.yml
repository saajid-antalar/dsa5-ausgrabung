name: Package Foundry release

# Ein Tag wie v1.0.1 pushen genügt: der Workflow baut das Archiv und legt das Release an.
# Wird ein Release von Hand in GitHub veröffentlicht, hängt er das Archiv dort an.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check version against tag
        run: |
          VERSION=$(jq -r .version module.json)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "module.json hat Version $VERSION, das Tag ist $TAG." >&2
            exit 1
          fi
          DOWNLOAD=$(jq -r .download module.json)
          case "$DOWNLOAD" in
            *"/releases/download/$TAG/dsa5-ausgrabung-$VERSION.zip") ;;
            *) echo "download-URL in module.json passt nicht zu $TAG: $DOWNLOAD" >&2; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build installable module archive
        run: |
          mkdir -p package
          cp module.json README.md package/
          cp -R scripts templates styles assets package/
          (cd package && zip -qr "../dsa5-ausgrabung-${VERSION}.zip" .)
          cp "dsa5-ausgrabung-${VERSION}.zip" dsa5-ausgrabung.zip

      - name: Create release or attach archives
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dsa5-ausgrabung-${VERSION}.zip" dsa5-ausgrabung.zip module.json --clobber
          else
            gh release create "$TAG" "dsa5-ausgrabung-${VERSION}.zip" dsa5-ausgrabung.zip module.json \
              --title "$TAG – Die Ausgrabung" \
              --notes "Installation in Foundry über die Manifest-URL:
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/module.json" \
              --verify-tag
          fi
