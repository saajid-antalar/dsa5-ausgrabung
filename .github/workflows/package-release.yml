name: Package Foundry release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check version against tag
        run: |
          VERSION=$(jq -r .version module.json)
          TAG="${{ github.event.release.tag_name }}"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "module.json hat Version $VERSION, das Release-Tag ist $TAG." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build installable module archive
        run: |
          mkdir -p package
          cp module.json README.md package/
          cp -R scripts templates styles assets package/
          (cd package && zip -qr "../dsa5-ausgrabung-${VERSION}.zip" .)
          cp "dsa5-ausgrabung-${VERSION}.zip" dsa5-ausgrabung.zip

      - name: Attach archives to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dsa5-ausgrabung-${VERSION}.zip" dsa5-ausgrabung.zip --clobber
